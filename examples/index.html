<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>touch-ctrl demo</title>
<style>
	body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f2; color: #222; }
	main { max-width: 640px; margin: 0 auto; padding: 16px; }
	h1 { font-size: 18px; margin: 0 0 12px; }
	#pad { position: relative; height: 260px; background: #1d1f24; border-radius: 12px; overflow: hidden; user-select: none; -webkit-user-select: none; }
	#range { position: absolute; border: 1px dashed #6b7280; pointer-events: none; }
	#dot { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; background: #f5c542; opacity: 0; transition: opacity .1s; pointer-events: none; }
	#pad.active #dot { opacity: 1; }
	.arrows { display: grid; grid-template-columns: repeat(3, 40px); gap: 4px; margin: 12px 0; }
	.arrows span { display: grid; place-items: center; height: 32px; border-radius: 6px; background: #ddd; font-size: 12px; }
	.arrows span.on { background: #f5c542; }
	pre { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 8px; height: 180px; overflow: auto; font-size: 12px; margin: 0; }
	.row { display: flex; gap: 16px; align-items: center; }
	output { font: 12px ui-monospace, monospace; white-space: pre; }
</style>
</head>
<body>
<main>
	<h1>touch-ctrl demo</h1>
	<div id="pad"><div id="range"></div><div id="dot"></div></div>
	<div class="row">
		<div class="arrows">
			<span></span><span id="t">上</span><span></span>
			<span id="l">左</span><span id="stop">停止</span><span id="r">右</span>
			<span></span><span id="b">下</span><span></span>
		</div>
		<output id="state"></output>
	</div>
	<pre id="log"></pre>
</main>
<script type="module">
	import TouchCtrl from '../src/touch-ctrl.js';

	const pad = document.getElementById('pad');
	const dot = document.getElementById('dot');
	const logEl = document.getElementById('log');
	const state = document.getElementById('state');
	const range = { x: 16, y: 16, w: pad.clientWidth - 32, h: pad.clientHeight - 32 };
	Object.assign(document.getElementById('range').style, {
		left: range.x + 'px', top: range.y + 'px', width: range.w + 'px', height: range.h + 'px'
	});

	const counts = { start: 0, move: 0, hold: 0, end: 0, cancel: 0 };
	const log = (name, locate) => {
		counts[name]++;
		logEl.textContent = `${name.padEnd(6)} x=${locate.x} y=${locate.y} dx=${locate.dx} dy=${locate.dy} ${locate.pointerType}\n` + logEl.textContent.slice(0, 4000);
	};
	const draw = locate => {
		dot.style.left = locate.x + 'px';
		dot.style.top = locate.y + 'px';
		for (const k of ['t', 'r', 'b', 'l']) document.getElementById(k).classList.toggle('on', locate[k]);
		document.getElementById('stop').classList.toggle('on', locate.isStop);
		state.textContent = Object.entries(counts).map(([k, v]) => `${k}: ${v}`).join('\n');
	};

	window.ctrl = new TouchCtrl({
		target: pad,
		range,
		interval: 500,
		fluctuation: 1,
		callback: {
			start(e, locate) { pad.classList.add('active'); log('start', locate); draw(locate); },
			move(e, locate) { log('move', locate); draw(locate); },
			hold(e, locate) { log('hold', locate); draw(locate); },
			end(e, locate) { pad.classList.remove('active'); log('end', locate); draw(locate); },
			cancel(e, locate) { pad.classList.remove('active'); log('cancel', locate || {}); }
		}
	});
	window.counts = counts;
</script>
</body>
</html>
